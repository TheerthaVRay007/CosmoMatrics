<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NASA Orbital Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
  </head>
  <body>
    <svg id="space-map" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-label="Interactive space map"></svg>

    <div class="hud top-left">
      <div class="brand">NASA / ORBITAL MAP</div>
    </div>

    <div class="hud top-right">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">−</button>
    </div>

    <aside id="object-detail" class="detail-panel hidden" aria-live="polite"></aside>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  </body>
</html>
